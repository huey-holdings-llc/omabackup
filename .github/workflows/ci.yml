name: ci
permissions:
  contents: read
on:
  push:
    branches: [main, "release/**", "feat/**", "fix/**"]
  pull_request:
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools (what an Omarchy install already has, plus gitleaks)
        run: pacman -Syu --noconfirm --needed git jq rsync shellcheck diffutils util-linux python gitleaks psmisc
      - uses: actions/checkout@v4
      - name: Static checks
        run: bash tests/lint.sh
      - name: Engine suite
        env:
          OMABACKUP_TEST_TMP: /root/omabackup-tests
          HOME: /root
        run: |
          git config --global --add safe.directory "$PWD"
          bash tests/engine.test.sh
